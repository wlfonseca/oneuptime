# Images are pushed to both Docker Hub and Github Container Registry. If you're using Github Container Registry, you can change the image tag to use the Github Container Registry.
# For example, if you want to use the image from Github Container Registry, you can change the image tag from oneuptime/dashboard:latest to ghcr.io/oneuptime/dashboard:latest

x-common-depends-on: &common-depends-on
  clickhouse:
    condition: service_healthy

x-common-extra-hosts: &common-extra-hosts
  - "postgres:10.0.0.3"
  - "redis:10.0.0.3"

services:
  clickhouse:
    extends:
      file: ./docker-compose.base.yml
      service: clickhouse

  app:
    build:
      network: host
      context: .
      dockerfile: ./App/Dockerfile
    image: oneuptime/app:${APP_TAG}
    extends:
      file: ./docker-compose.base.yml
      service: app
    extra_hosts: *common-extra-hosts
    depends_on:
      <<: *common-depends-on
    command:
      [
        "/bin/bash",
        "-c",
        "NODE_OPTIONS='--max-old-space-size=4096' node --no-node-snapshot --require ts-node/register Index.ts",
      ]

  probe-1:
    build:
      network: host
      context: .
      dockerfile: ./Probe/Dockerfile
    image: oneuptime/probe:${APP_TAG}
    extends:
      file: ./docker-compose.base.yml
      service: probe-1
    extra_hosts: *common-extra-hosts
    depends_on:
      <<: *common-depends-on
    command:
      [
        "/bin/bash",
        "-c",
        "NODE_OPTIONS='--max-old-space-size=2048' node --no-node-snapshot --require ts-node/register Index.ts",
      ]

  ingress:
    build:
      network: host
      context: .
      dockerfile: ./Nginx/Dockerfile
    image: oneuptime/nginx:${APP_TAG}
    extends:
      file: ./docker-compose.base.yml
      service: ingress
    extra_hosts: *common-extra-hosts
    depends_on:
      <<: *common-depends-on
    ports:
      - "127.0.0.1:7849:7849"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oneuptime.rule=Host(`oneuptime.cw2tecnologia.com.br`)"
      - "traefik.http.routers.oneuptime.tls=true"
      - "traefik.http.routers.oneuptime.tls.certresolver=letsencrypt"
      - "traefik.http.services.oneuptime.loadbalancer.server.port=7849"

  ai-agent:
    image: ghcr.io/oneuptime/ai-agent:${APP_TAG}
    extends:
      file: ./docker-compose.base.yml
      service: ai-agent

  freeswitch:
    image: safarov/freeswitch:latest
    restart: unless-stopped
    networks:
      - oneuptime
    ports:
      - "8021:8021"
    volumes:
      - ./FreeSwitch/event_socket.conf.xml:/usr/share/freeswitch/conf/vanilla/autoload_configs/event_socket.conf.xml
      - ./FreeSwitch/acl.conf.xml:/usr/share/freeswitch/conf/vanilla/autoload_configs/acl.conf.xml
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE

  backup:
    build:
      context: ./DockerBackup
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - oneuptime
    extra_hosts: *common-extra-hosts
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - DATABASE_HOST=10.0.0.3
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_PREFIX=${S3_PREFIX:-oneuptime-backups}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - CRON_SCHEDULE=${BACKUP_CRON_SCHEDULE:-0 3 * * *}
    volumes:
      - backups:/backups

volumes:
  clickhouse:
  backups:

networks:
  oneuptime:
    driver: bridge
